<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggest a Food · Taste Vietnam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="page-hero">
      <h1 data-trans="heroTitle">Suggest a New Food</h1>
      <p data-trans="heroText">Submit a dish for review. Category, ingredients, and images are filled in by the admin after research. Entries go to Google Sheets via Apps Script (Pending → Approved / Rejected).</p>
    </div>

    <form class="form-stack" id="add-food-form" novalidate>
      <div class="form-field">
        <label for="foodName"><span data-trans="foodName">Food Name</span> *</label>
        <input id="foodName" name="foodName" required />
      </div>
      <div class="form-field">
        <label for="vietnameseName"><span data-trans="vietnameseName">Vietnamese Name</span> *</label>
        <input id="vietnameseName" name="vietnameseName" required />
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div class="form-field">
          <label for="province"><span data-trans="province">Province</span> *</label>
          <input id="province" name="province" required />
        </div>
        <div class="form-field">
          <span class="form-legend"><span data-trans="region">Region</span> *</span>
          <div class="region-radios" role="radiogroup" aria-label="Region">
            <label class="region-radio">
              <input type="radio" name="region" value="North" required />
              <span data-trans="north">North</span>
            </label>
            <label class="region-radio">
              <input type="radio" name="region" value="Central" />
              <span data-trans="central">Central</span>
            </label>
            <label class="region-radio">
              <input type="radio" name="region" value="South" />
              <span data-trans="south">South</span>
            </label>
          </div>
        </div>
      </div>
      <div class="form-field">
        <label for="description"><span data-trans="description">Description</span> *</label>
        <textarea id="description" name="description" required></textarea>
        <p class="muted text-sm mt-1"><span id="desc-count">0</span> <span data-trans="characters">characters</span></p>
      </div>
      <div class="form-field">
        <label for="price" data-trans="price">Price (VND range)</label>
        <input id="price" name="price" placeholder="30000 - 60000" />
      </div>

      <p class="muted text-sm" id="form-message" role="status"></p>
      <button type="submit" class="btn btn--primary" id="submit-btn" data-trans="submit">Submit Food</button>
    </form>
  </main>

  <div id="site-footer"></div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/add-food.js"></script>
</body>
</html>
