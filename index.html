<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taste Vietnam | Discover Vietnam Through Food</title>
  <link rel="icon" type="image/png" href="assets/images/logo1.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="hero-small" data-trans="home.heroSmall"></p>
        <h1 data-trans="home.heroTitleHtml" data-trans-html="true"></h1>
        <p class="hero-description" data-trans="home.heroDesc"></p>
        <a href="#regions" class="primary-btn">
          <span data-trans="home.heroCta"></span> <span>→</span>
        </a>
      </div>
    </section>

    <section class="intro section">
      <p class="section-label" data-trans="home.introLabel"></p>
      <h2 data-trans="home.introTitleHtml" data-trans-html="true"></h2>
      <p class="intro-text" data-trans="home.introText"></p>
    </section>

    <section class="regions section" id="regions">
      <div class="section-heading">
        <div>
          <p class="section-label" data-trans="home.regionsLabel"></p>
          <h2 data-trans="home.regionsTitle"></h2>
        </div>
        <p class="heading-description" data-trans="home.regionsDesc"></p>
      </div>
      <div class="region-grid" id="region-grid"></div>
    </section>

    <section class="culture section">
      <div class="culture-image"></div>
      <div class="culture-content">
        <p class="section-label" data-trans="home.cultureLabel"></p>
        <h2 data-trans="home.cultureTitleHtml" data-trans-html="true"></h2>
        <p data-trans="home.cultureP1"></p>
        <p data-trans="home.cultureP2"></p>
        <a href="articles.html" class="secondary-btn" data-trans="home.cultureCta"></a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
